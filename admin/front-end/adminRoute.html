<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Routes Management - DarbGo Admin</title>

    <link rel="stylesheet" href="../css-file/admin.css" />
  </head>
  <body>
    <div class="admin-shell">
      <main class="admin-main">
        <div class="admin-content">
          <div class="page-heading">
            <h1>Routes Management</h1>
            <p>
              Monitor all transportation routes, capacities, assigned drivers,
              and active statuses
            </p>
          </div>

          <div>
            <form id="routeFilterForm" class="admin-filters">
              <div>
                <label for="searchRouteInput">Search Routes:</label>
                <input
                  type="text"
                  id="searchRouteInput"
                  placeholder="Search by driver, area, or university..."
                />
              </div>

              <div>
                <label for="universityRouteFilter">Filter by University:</label>
                <select id="universityRouteFilter">
                  <option value="all">All Universities</option>
                </select>
              </div>

              <div>
                <label for="statusRouteFilter">Filter by Status:</label>
                <select id="statusRouteFilter">
                  <option value="all">All Statuses</option>
                  <option value="active">Active</option>
                  <option value="disabled">Disabled</option>
                </select>
              </div>

              <button type="reset" id="resetRouteFiltersBtn">
                Reset Filters
              </button>
            </form>
          </div>

          <div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Route ID</th>
                    <th>Driver</th>
                    <th>From</th>
                    <th>To</th>
                    <th>University</th>
                    <th>Students</th>
                    <th>Capacity</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="routesTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="routeModal" class="admin-modal" hidden>
      <div>
        <button type="button" id="closeRouteModalBtn">&times; Close</button>
        <h2>Route Details & Audit</h2>

        <section id="routeDetailsSection"></section>

        <section>
          <h3>Administrative Actions</h3>
          <form id="routeStatusForm">
            <input type="hidden" id="modalRouteId" />
            <label for="routeAdminNotes"
              >Reason for Action / Issue Details:</label
            ><br />
            <textarea
              id="routeAdminNotes"
              rows="3"
              placeholder="Enter reason for disabling or restoring route..."
            ></textarea>
            <br />
            <button type="button" id="disableRouteBtn">Disable Route</button>
            <button type="button" id="enableRouteBtn">Enable Route</button>
          </form>
        </section>
      </div>
    </div>

    <script src="../JS-file/apiClient.js"></script>
    <script src="../JS-file/layout.js"></script>
    <script src="../JS-file/main.js"></script>
  </body>
</html>
