<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Admin - DarbGo Admin</title>

    <link rel="stylesheet" href="../css-file/admin.css" />
  </head>
  <body>
    <div class="admin-shell">
      <main class="admin-main">
        <div class="admin-content">
          <div class="page-heading">
            <h1>Create Admin</h1>
            <p>Create a new authorized administrator account.</p>
          </div>

          <div class="admin-panel">
            <h2>Account Details</h2>
            <form id="createAdminForm">
              <div>
                <label for="fullName">Full Name</label>
                <input
                  type="text"
                  id="fullName"
                  name="fullName"
                  minlength="2"
                  maxlength="120"
                  autocomplete="name"
                  required
                />
              </div>

              <div>
                <label for="email">Email Address</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  autocomplete="email"
                  required
                />
              </div>

              <div>
                <label for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  minlength="12"
                  maxlength="72"
                  autocomplete="new-password"
                  required
                />
                <button
                  type="button"
                  id="toggleAdminPassword"
                  aria-controls="password"
                  aria-pressed="false"
                >
                  Show password
                </button>
              </div>

              <button type="submit" id="submitAdminBtn">Create Admin</button>
            </form>

            <div id="responseMessage" role="status" aria-live="polite"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="../JS-file/apiClient.js"></script>
    <script src="../JS-file/layout.js"></script>
    <script src="../JS-file/createAdmin.js"></script>
  </body>
</html>
