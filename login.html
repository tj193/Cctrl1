<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - DarbGo</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<div class="form-container">

    <h1>Welcome Back to DarbGo</h1>

    <p class="form-description">
        Login to continue
    </p>


    <form id="loginForm">


        <label>Email / Phone</label>

        <input
            type="text"
            id="loginIdentifier"
            placeholder="Enter email or phone"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
            required
        >


        <div class="remember-row">

            <label class="remember-label">

                <input
                    type="checkbox"
                    id="rememberMe"
                >

                Remember Me

            </label>


            <a href="#">
                Forgot Password?
            </a>

        </div>


        <button type="submit">
            Login
        </button>


    </form>


    <p class="bottom-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </p>

</div>


<script src="app.js"></script>

</body>

</html>
