<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join DarbGo</title>
    <link rel="stylesheet" href="css/registeration-style.css">
</head>

<body>

    <div class="register-container">

        <div class="top-nav">
            <div class="brand-logo">
                <img src="assets/logo/darbgo-logo.png" alt="DarbGo Logo">
            </div>

            <a href="index.html" class="back-link">← Back to home</a>
        </div>

        <div class="register-header">
            <h1>Join DarbGo</h1>
            <p>Choose how you'll use DarbGo</p>
        </div>

        <div class="role-container">

            <div class="role-card student-card"
                 onclick="window.location.href='student-register.html'">

                <div class="card-top">
                    <span class="role-badge badge-student">
                        For students
                    </span>
                </div>

                <div class="role-icon">🎓</div>

                <h2>I'm a Student</h2>

                <p>
                    Find university transportation that matches your
                    location and schedule.
                </p>

                <button class="card-btn">
                    Continue as Student
                </button>

            </div>


            <div class="role-card driver-card"
                 onclick="window.location.href='driver-register.html'">

                <div class="card-top">
                    <span class="role-badge badge-driver">
                        For drivers
                    </span>
                </div>

                <div class="role-icon">🚗</div>

                <h2>I'm a Driver</h2>

                <p>
                    Create routes, manage students and discover
                    transportation opportunities.
                </p>

                <button class="card-btn">
                    Continue as Driver
                </button>

            </div>

        </div>

        <div class="login-link">
            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>

    </div>

</body>
</html>
