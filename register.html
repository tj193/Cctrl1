<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join DarbGo</title>

    <link rel="stylesheet" href="registeration-style.css">
</head>

<body>

    <div class="register-container">

        <div class="register-header">
            <h1>Join DarbGo</h1>

            <p>Choose how you'll use DarbGo</p>
        </div>


        <div class="role-container">

            <!-- Student -->

            <div class="role-card"
                 onclick="window.location.href='student-register.html'">

                <div class="role-icon">
                    🎓
                </div>

                <h2>I'm a Student</h2>

                <p>
                    Find university transportation that matches
                    your location and schedule.
                </p>

                <button>
                    Continue as Student
                </button>

            </div>


            <!-- Driver -->

            <div class="role-card"
                 onclick="window.location.href='driver-register.html'">

                <div class="role-icon">
                    🚗
                </div>

                <h2>I'm a Driver</h2>

                <p>
                    Create routes, manage students and discover
                    transportation opportunities.
                </p>

                <button>
                    Continue as Driver
                </button>

            </div>

        </div>


        <div class="login-link">

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
