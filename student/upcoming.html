<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your journey — DarbGo</title>
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="../css/student/dashboard.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="../js/auth/account-store.js" defer></script>
  <script src="api.js" defer></script>
  <script src="dashboard-data.js" defer></script>
  <script src="../js/components/journey-map.js" defer></script>
  <script src="dashboard-views.js" defer></script>
  <script src="dashboard.js" defer></script>
  <script src="live-dashboard.js" defer></script>
</head>
<body data-role="student" data-page="upcoming">
  <a class="skip-link" href="#mainContent">Skip to content</a>
  <header class="student-header">
    <a class="brand" href="../index.html" aria-label="DarbGo home"><img src="../assets/logo/darbgo-logo.png" alt=""><span>Darb<span>Go</span></span></a>
    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-controls="studentSidebar" aria-expanded="false">Menu</button>
    <div class="account-menu">
      <button class="notification-button" id="notificationButton" type="button" aria-label="Notifications" aria-expanded="false"><span class="bell-mark" aria-hidden="true"></span><span>Notifications</span><b id="notificationCount">3</b></button>
      <button class="profile-button" type="button" id="profileButton" aria-expanded="false"><span class="profile-initial" id="profileInitial" aria-hidden="true">S</span><span id="profileName">Student</span></button>
      <div class="profile-popover" id="profilePopover" hidden><strong id="profilePopoverName">Student</strong><span id="profilePopoverEmail"></span><button type="button" id="logoutButton">Log out</button></div>
    </div>
  </header>
<div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
<aside class="student-sidebar" id="studentSidebar" aria-label="Student sidebar"><p class="sidebar-label">STUDENT SPACE</p><nav aria-label="Student navigation"><a href="dashboard.html" data-page="journey">Journey</a><a href="routes.html" data-page="routes">Routes</a><a href="requests.html" data-page="requests">Requests</a><a href="waitlist.html" data-page="waitlist">Waitlist</a><a href="upcoming.html" data-page="upcoming">Upcoming ride</a><a href="reports.html" data-page="reports">Reports &amp; Support</a></nav><p class="sidebar-note">Your university journey,<br>one step at a time.</p></aside>
  <main id="mainContent" tabindex="-1"></main>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div><aside class="notification-drawer" id="notificationDrawer" aria-labelledby="notificationTitle" aria-hidden="true"><header><div><p class="eyebrow-label">STAY UPDATED</p><h2 id="notificationTitle">Notifications</h2></div><button class="icon-button" id="closeNotifications" type="button" aria-label="Close notifications">Close</button></header><button class="mark-read-button" id="markAllRead" type="button">Mark all as read</button><div class="notification-list" id="notificationList"></div></aside>
  <dialog class="route-dialog" id="routeDialog" aria-labelledby="dialogTitle"><button class="dialog-close" id="closeRouteDialog" type="button" aria-label="Close route details">Close</button><div id="routeDialogContent"></div></dialog><div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="demo-dock"><label for="demoScenario">Preview state</label><select id="demoScenario"><option value="" disabled selected>Choose preview state</option><option value="routes">Multiple matching routes</option><option value="no-match">No matching routes</option><option value="waitlist">Joined waitlist</option><option value="waitlist-match">New waitlist match</option><option value="pending">Request pending</option><option value="accepted">Request accepted</option><option value="confirmed">Request confirmed</option><option value="declined">Request declined</option><option value="action">Action required</option><option value="multiple">Multiple requests</option><option value="notifications">Unread notifications</option><option value="message">Driver message</option><option value="upcoming">Confirmed upcoming ride</option></select></div>

  <script src="../js/components/student-pet.js"></script>
</body>
</html>
